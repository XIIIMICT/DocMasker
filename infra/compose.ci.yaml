# Isolated integration stack for CI. Never includes the developer's .env,
# volumes or log directories. PostgreSQL + Valkey are private (no host ports);
# the backend waits for healthy infrastructure before serving.
name: docmasker-ci

x-back-env: &back-env
  BACKEND_PORT: "8001"
  AUTH_APP_ORIGIN: http://127.0.0.1:15001
  BACKEND_CORS_ORIGINS: '["http://127.0.0.1:15001"]'
  DATABASE_URL: postgresql+psycopg://dm:ci_password@postgres:5432/dm_ci
  VALKEY_URL: redis://:ci_cache_password@valkey:6379/0
  CACHE_KEY_SECRET: ci-only-cache-secret-32-chars-long
  CACHE_ENABLED: "true"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DB_CONNECT_TIMEOUT_SECONDS: "5"
  JOBS_DIR: /app/jobs

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: dm_ci
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dm -d dm_ci"]
      interval: 2s
      timeout: 5s
      retries: 30
  valkey:
    image: valkey/valkey:8-alpine
    command:
      [
        "valkey-server",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--requirepass",
        "ci_cache_password",
      ]
    healthcheck:
      test: [CMD, valkey-cli, -a, "ci_cache_password", ping]
      interval: 2s
      timeout: 5s
      retries: 30
  back:
    image: dm-back:ci
    build:
      context: ../back
      target: prod
      args:
        BACKEND_PORT: "8001"
    environment: *back-env
    ports: ["127.0.0.1:18001:8001"]
    volumes: ["jobs-data:/app/jobs"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 2s
      timeout: 5s
      retries: 30
  worker:
    image: dm-back:ci
    environment: *back-env
    command: ["python", "-m", "src.jobs.worker"]
    volumes: ["jobs-data:/app/jobs"]
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      back:
        condition: service_healthy
  front:
    image: dm-front:ci
    build:
      context: ../front
      target: prod
      args:
        PORT: "5001"
    environment:
      PORT: "5001"
      BACKEND_INTERNAL_URL: http://back:8001
    ports: ["127.0.0.1:15001:5001"]
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:5001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  jobs-data:
