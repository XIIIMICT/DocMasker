# Data services for DocMasker (mirrors ReportCollector's infra/compose.db.yaml).
#
# Started explicitly with `just db-stand`, NOT together with the application:
# `just dev` / `just prod` list only app services and have no depends_on for
# postgres/valkey. The application is designed for an already-provisioned
# PostgreSQL/Valkey pair; schema creation is the explicit `just seed` / `just
# migrate` step, never a startup race.
#
# Both services are reachable on the private compose networks (`net`, `net-dev`)
# under their service names. PostgreSQL also publishes loopback-only 5432 so
# host-side tools (seed, migrations, psql) can reach it.
services:
  postgres:
    container_name: dm-postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [net, net-dev]

  # Disposable TTL cache index (Phase 3). Cache loss must be safe.
  valkey:
    container_name: dm-valkey
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--requirepass",
        "${VALKEY_PASSWORD:?}",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:?}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [net, net-dev]

  # Logical backup sidecar: daily verified pg_dump into a dedicated volume,
  # weekly restore drill into a scratch DB. Deliberately NOT in `just db-stand`'s
  # explicit service list — start it with `just backup-stand`. No host port:
  # Prometheus scrapes it on `net` (job `docmasker-pg-backup`).
  pgbackup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: dm-pgbackup
    restart: unless-stopped
    environment:
      # Inside compose use the postgres service name; for an external prod DB
      # set POSTGRES_HOST_DOCKER to its address (same escape hatch as `back`).
      POSTGRES_HOST: ${POSTGRES_HOST_DOCKER:-postgres}
      # Container-side port is always 5432; POSTGRES_PORT in .env is the
      # host-side loopback publish (15433) for seed/migrations, not this hop.
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      BACKUP_DIR: /var/backups/docmasker
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
      BACKUP_DRILL_WEEKDAY: ${BACKUP_DRILL_WEEKDAY:-6}
      BACKUP_DRILL_HOUR_UTC: ${BACKUP_DRILL_HOUR_UTC:-3}
      # Optional command template with one `{file}` token, e.g.
      # `aws s3 cp {file} s3://bucket/prefix/` or `rsync -a {file} host:/dir/`.
      # Empty means the off-host requirement is NOT satisfied; see docs/RUNBOOKS.md.
      BACKUP_OFFHOST_TARGET: ${BACKUP_OFFHOST_TARGET:-}
      BACKUP_METRICS_PORT: "9113"
    volumes:
      - postgres-backups:/var/backups/docmasker
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9113/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [net]

volumes:
  postgres-data:
    name: dm-postgres-data
  postgres-backups:
    name: dm-postgres-backups
