apiVersion: 1

datasources:
  - name: DocMasker Loki
    type: loki
    access: proxy
    # In-project default (http://loki:3100) or the central stack via LOKI_URL.
    url: ${LOKI_URL}
    uid: docmasker-loki
    # Default datasource: Explore and bare panels open on logs first.
    isDefault: true
    editable: true
    jsonData:
      maxLines: 1000
