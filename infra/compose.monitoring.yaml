# DocMasker monitoring stack (same wiring contract as ReportCollector/excel_loader):
#   logs    — Alloy (stateless, no profile, always started) tails ../logs -> Loki -> Grafana;
#   metrics — Prometheus scrapes the long-running backend and worker (/metrics)
#             -> Alertmanager (mail through the in-project Postfix relay).
#
# No Pushgateway here: the worker is a long-running process and is scraped directly.
# `just monitoring` starts only Alloy (external/central Loki mode);
# `just monitoring-stand` starts the full local stack. All services are
# profile-less by design — the recipe selects them, profiles are reserved for
# the application (prod/dev) in the root compose.yaml.
#
# Network `net` is declared in the root compose.yaml as `dm-net`; included files
# join it rather than redeclaring it. For external mode set LOKI_URL and the
# scrape hosts in .env (see .env.example, "Monitoring").

services:
  alloy:
    container_name: dm-alloy
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    command: [run, /etc/alloy/config.alloy, --server.http.listen-addr=0.0.0.0:12345]
    environment:
      # In-project default: http://loki:3100. On a server with the central DWH
      # stack override it to http://host.docker.internal:3100 or the central URL.
      LOKI_URL: ${LOKI_URL:?LOKI_URL is required — set it in .env}
      LOG_ENV: ${LOG_ENV:-local}
    volumes:
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ../logs:/var/log/docmasker:ro
    networks: [net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:12345:12345"

  loki:
    container_name: dm-loki
    image: grafana/loki:3.7
    restart: unless-stopped
    # -config.expand-env=true expands ${LOKI_RETENTION} in config.yaml, so no
    # separate renderer is needed for retention.
    command:
      - -config.file=/etc/loki/config.yaml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-168h}
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [net]
    ports:
      - "127.0.0.1:3100:3100"

  prometheus:
    container_name: dm-prometheus
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    # entrypoint.sh renders the config and prepends --config.file=/tmp/prometheus.yml;
    # all flags below are passed through as "$@".
    command:
      - --storage.tsdb.path=/prometheus
      # 15d of raw samples at a 15s scrape: enough for week-over-week checks
      # without unbounded disk growth (env-configurable).
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    environment:
      # Rendered into the scrape config at container start by entrypoint.sh —
      # Prometheus itself does not expand ${VAR} in its config file.
      BACKEND_METRICS_HOST: ${BACKEND_METRICS_HOST:-back}
      BACKEND_PORT: ${BACKEND_PORT:?}
      WORKER_METRICS_HOST: ${WORKER_METRICS_HOST:-worker}
      WORKER_METRICS_PORT: ${WORKER_METRICS_PORT:-8002}
      BACKUP_METRICS_HOST: ${BACKUP_METRICS_HOST:-pgbackup}
      BACKUP_METRICS_PORT: ${BACKUP_METRICS_PORT:-9113}
      LOG_ENV: ${LOG_ENV:-local}
    volumes:
      - ./prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      - ./prometheus/entrypoint.sh:/entrypoint.sh:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks: [net]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9090:9090"

  alertmanager:
    container_name: dm-alertmanager
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      SUPPORT_MAIL: ${SUPPORT_MAIL:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      # Internal hop to our own relay: plain SMTP on port 25. The relay does
      # STARTTLS 587 to the corporate SMTP host (documented deviation).
      ALERT_SMTP_SMARTHOST: ${ALERT_SMTP_SMARTHOST:-smtp-relay:25}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
    volumes:
      - ./alertmanager/alertmanager.tpl.yml:/etc/alertmanager/alertmanager.tpl.yml:ro
      - ./alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    networks: [net]
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    container_name: dm-grafana
    image: grafana/grafana:13.1-slim
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?GF_SECURITY_ADMIN_USER is required — set it in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required — set it in .env}
      GF_USERS_DEFAULT_THEME: dark
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks: [net]
    ports:
      - "127.0.0.1:3000:3000"

  # In-project relay: Alertmanager -> relay is plain SMTP:25; relay -> corporate
  # SMTP uses STARTTLS:587 with the SMTP_RELAY_* credentials from .env.
  smtp-relay:
    container_name: dm-smtp-relay
    image: juanluisbaptiste/postfix:1.11
    restart: unless-stopped
    environment:
      SMTP_SERVER: ${SMTP_RELAY_SERVER:-}
      SMTP_PORT: ${SMTP_RELAY_PORT:-587}
      SMTP_USERNAME: ${SMTP_RELAY_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
      SERVER_HOSTNAME: ${SMTP_RELAY_HOSTNAME:-smtp-relay}
    networks: [net]

volumes:
  loki-data:
    name: dm-loki-data
  grafana-data:
    name: dm-grafana-data
  prometheus-data:
    name: dm-prometheus-data
  alertmanager-data:
    name: dm-alertmanager-data
