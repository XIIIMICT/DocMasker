name: docmasker

# Порты задаются один раз в корневом .env (BACKEND_PORT / FRONT_PORT)
# и отсюда же расходятся: ARG в Dockerfile (порт в контейнере), проброс порта,
# healthcheck. Все обязательные (:? — при отсутствии compose падает с понятной
# ошибкой, а не молча подставляет дефолт).
services:
  # Authoritative job state (ADR-0003). Private: no host/network port in prod.
  postgres:
    profiles: [prod, dev]
    container_name: dm-postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [net, net-dev]

  # Disposable TTL cache index (Phase 3). Cache loss must be safe.
  valkey:
    profiles: [prod, dev]
    container_name: dm-valkey
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command:
      [
        "valkey-server",
        "--appendonly",
        "no",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--requirepass",
        "${VALKEY_PASSWORD:?}",
      ]
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD:?}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [net, net-dev]

  back:
    profiles: [prod]
    container_name: dm-back
    build:
      context: ./back
      dockerfile: Dockerfile
      target: prod
      args:
        BACKEND_PORT: ${BACKEND_PORT:?}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:5001","http://127.0.0.1:5001","${AUTH_APP_ORIGIN:?}"]}'
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      VALKEY_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_KEY_SECRET: ${CACHE_KEY_SECRET:?}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      CACHE_NAMESPACE_VERSION: ${CACHE_NAMESPACE_VERSION:-1}
      MASKING_RULESET_VERSION: ${MASKING_RULESET_VERSION:-1}
      RESULT_MANIFEST_VERSION: ${RESULT_MANIFEST_VERSION:-1}
      MASKING_CONFIG_DIGEST: ${MASKING_CONFIG_DIGEST:-none}
      KEYS_FORMAT_VERSION: ${KEYS_FORMAT_VERSION:-1}
      DOCX_TRANSFORMER_VERSION: ${DOCX_TRANSFORMER_VERSION:-1}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    ports:
      # Loopback-only: the API stays reachable for local testing but never
      # from the network — the browser must go through the front proxy.
      - "127.0.0.1:${BACKEND_PORT:?}:${BACKEND_PORT:?}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:?}/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Private id-keyed artifact spool, shared with the worker (ADR-0003).
      - jobs-data:/app/jobs
    networks: [net]

  worker:
    profiles: [prod]
    container_name: dm-worker
    build:
      context: ./back
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    command: ["python", "-m", "src.jobs.worker"]
    volumes:
      - jobs-data:/app/jobs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      back:
        condition: service_healthy
    networks: [net]

  worker-dev:
    profiles: !override [dev]
    container_name: dm-worker-dev
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: ./.env
        required: true
    command: ["python", "-m", "src.jobs.worker"]
    volumes:
      - jobs-data:/app/jobs
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      back-dev:
        condition: service_started
    networks: !override [net-dev]

  back-dev:
    profiles: !override [dev]
    extends: back
    container_name: dm-back-dev
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
      args:
        BACKEND_PORT: ${BACKEND_PORT:?}
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
        - action: rebuild
          path: ./back/pyproject.toml
        - action: rebuild
          path: ./back/uv.lock

  front:
    profiles: [prod]
    container_name: dm-front
    build:
      context: ./front
      dockerfile: Dockerfile
      target: prod
      args:
        PORT: ${FRONT_PORT:?}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      # Адрес бэкенда для server-side прокси /api/mask (имя сервиса в compose-сети).
      BACKEND_INTERNAL_URL: http://back:${BACKEND_PORT:?}
    ports:
      - "${FRONT_PORT:?}:${FRONT_PORT:?}"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '${FRONT_PORT:?}') + '/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  front-dev:
    profiles: !override [dev]
    extends: front
    container_name: dm-front-dev
    build:
      context: ./front
      dockerfile: Dockerfile
      target: dev
      args:
        PORT: ${FRONT_PORT:?}
    depends_on: !override
      back-dev:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://back-dev:${BACKEND_PORT:?}
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./front/src
          target: /app/src
        - action: sync
          path: ./front/public
          target: /app/public
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/bun.lock
        - action: rebuild
          path: ./front/next.config.ts
        - action: rebuild
          path: ./front/postcss.config.ts
        - action: rebuild
          path: ./front/tsconfig.json

networks:
  net:
    name: dm-net
  net-dev:
    name: dm-net-dev

volumes:
  # Never published: job input/result artifacts stay on this private volume,
  # shared only by back and worker (ADR-0003).
  jobs-data:
    name: dm-jobs-data
  # PostgreSQL is the authoritative job store; this volume is backed up.
  postgres-data:
    name: dm-postgres-data
