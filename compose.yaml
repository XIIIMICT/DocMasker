name: docmasker

# Data services (PostgreSQL + Valkey) live in infra/compose.db.yaml and are
# started explicitly with `just db-stand`, mirroring ReportCollector. The app
# recipes never start them implicitly and have no depends_on — see
# infra/AGENTS.md.
include:
  - path: ./infra/compose.db.yaml
  # Monitoring services are profile-less; just monitoring[-stand] selects them.
  - path: ./infra/compose.monitoring.yaml

# Host-side .env keeps POSTGRES_HOST=localhost (seed/migrations); containers
# override it with POSTGRES_HOST_DOCKER (the compose service name). Same pattern
# as ReportCollector. Shared by back and both worker variants.
x-db-env: &db-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@${POSTGRES_HOST_DOCKER:-postgres}:5432/${POSTGRES_DB:?}
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379/0

# Порты задаются один раз в корневом .env (BACKEND_PORT / FRONT_PORT)
# и отсюда же расходятся: ARG в Dockerfile (порт в контейнере), проброс порта,
# healthcheck. Все обязательные (:? — при отсутствии compose падает с понятной
# ошибкой, а не молча подставляет дефолт).
services:
  back:
    profiles: [prod]
    container_name: dm-back
    build:
      context: ./back
      dockerfile: Dockerfile
      target: prod
      args:
        BACKEND_PORT: ${BACKEND_PORT:?}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      <<: *db-env
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:5001","http://127.0.0.1:5001","${AUTH_APP_ORIGIN:?}"]}'
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_KEY_SECRET: ${CACHE_KEY_SECRET:?}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
      CACHE_NAMESPACE_VERSION: ${CACHE_NAMESPACE_VERSION:-1}
      MASKING_RULESET_VERSION: ${MASKING_RULESET_VERSION:-1}
      RESULT_MANIFEST_VERSION: ${RESULT_MANIFEST_VERSION:-1}
      MASKING_CONFIG_DIGEST: ${MASKING_CONFIG_DIGEST:-auto}
      MASKING_CONFIG_DIR: ${MASKING_CONFIG_DIR:-/app/config/masking}
      KEYS_FORMAT_VERSION: ${KEYS_FORMAT_VERSION:-1}
      DOCX_TRANSFORMER_VERSION: ${DOCX_TRANSFORMER_VERSION:-2}
    ports:
      # Loopback-only: the API stays reachable for local testing but never
      # from the network — the browser must go through the front proxy.
      - "127.0.0.1:${BACKEND_PORT:?}:${BACKEND_PORT:?}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:?}/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      # Private id-keyed artifact spool, shared with the worker (ADR-0003).
      - jobs-data:/app/jobs
      # Private runtime exceptions: mounted read-only, never baked into the image.
      - ./back/config/masking/exceptions.yaml:/app/config/masking/exceptions.yaml:ro
    networks: [net]

  worker:
    profiles: [prod]
    container_name: dm-worker
    build:
      context: ./back
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    command: ["python", "-m", "src.jobs.worker"]
    environment:
      <<: *db-env
    volumes:
      - jobs-data:/app/jobs
      # Private runtime exceptions: mounted read-only, never baked into the image.
      - ./back/config/masking/exceptions.yaml:/app/config/masking/exceptions.yaml:ro
    depends_on:
      back:
        condition: service_healthy
    networks: [net]

  worker-dev:
    profiles: !override [dev]
    container_name: dm-worker-dev
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
    env_file:
      - path: ./.env
        required: true
    command: ["python", "-m", "src.jobs.worker"]
    environment:
      <<: *db-env
    volumes:
      - jobs-data:/app/jobs
      # Private runtime exceptions: mounted read-only, never baked into the image.
      - ./back/config/masking/exceptions.yaml:/app/config/masking/exceptions.yaml:ro
    depends_on: !override
      back-dev:
        condition: service_started
    networks: !override [net-dev]

  back-dev:
    profiles: !override [dev]
    extends: back
    container_name: dm-back-dev
    build:
      context: ./back
      dockerfile: Dockerfile
      target: dev
      args:
        BACKEND_PORT: ${BACKEND_PORT:?}
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./back/src
          target: /app/src
        - action: rebuild
          path: ./back/pyproject.toml
        - action: rebuild
          path: ./back/uv.lock

  front:
    profiles: [prod]
    container_name: dm-front
    build:
      context: ./front
      dockerfile: Dockerfile
      target: prod
      args:
        PORT: ${FRONT_PORT:?}
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      # Адрес бэкенда для server-side прокси /api/mask (имя сервиса в compose-сети).
      BACKEND_INTERNAL_URL: http://back:${BACKEND_PORT:?}
    ports:
      - "${FRONT_PORT:?}:${FRONT_PORT:?}"
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:' + (process.env.PORT || '${FRONT_PORT:?}') + '/api/health').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [net]

  front-dev:
    profiles: !override [dev]
    extends: front
    container_name: dm-front-dev
    build:
      context: ./front
      dockerfile: Dockerfile
      target: dev
      args:
        PORT: ${FRONT_PORT:?}
    depends_on: !override
      back-dev:
        condition: service_started
    environment:
      BACKEND_INTERNAL_URL: http://back-dev:${BACKEND_PORT:?}
    networks: !override [net-dev]
    develop:
      watch:
        - action: sync
          path: ./front/src
          target: /app/src
        - action: sync
          path: ./front/public
          target: /app/public
        - action: rebuild
          path: ./front/package.json
        - action: rebuild
          path: ./front/bun.lock
        - action: rebuild
          path: ./front/next.config.ts
        - action: rebuild
          path: ./front/postcss.config.ts
        - action: rebuild
          path: ./front/tsconfig.json

networks:
  net:
    name: dm-net
  net-dev:
    name: dm-net-dev

volumes:
  # Never published: job input/result artifacts stay on this private volume,
  # shared only by back and worker (ADR-0003).
  jobs-data:
    name: dm-jobs-data
  # postgres-data is declared in infra/compose.db.yaml (included above).
