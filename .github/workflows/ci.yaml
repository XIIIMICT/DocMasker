name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  config:
    name: Workflow and Compose validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Validate Compose
        run: |
          cp .env.example .env
          docker compose --profile prod --profile dev config --quiet
          docker compose -f infra/compose.ci.yaml config --quiet
      - name: Validate internal port bindings
        run: python3 infra/check-monitoring-binds.py

  back:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    env:
      COVERAGE_FILE: coverage-data
      TEST_DATABASE_URL: postgresql+psycopg://dm:ci_password@127.0.0.1:15432/dm_ci
      # Alembic's env.py reads DATABASE_URL (or builds one from POSTGRES_*
      # defaults -> localhost:15433/dm). TEST_DATABASE_URL alone only configures
      # pytest, so migrations silently ran against a non-existent database.
      DATABASE_URL: postgresql+psycopg://dm:ci_password@127.0.0.1:15432/dm_ci
      TEST_VALKEY_URL: redis://127.0.0.1:16379/0
      CACHE_KEY_SECRET: ci-only-cache-secret-32-chars-long
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dm
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: dm_ci
        ports: ["127.0.0.1:15432:5432"]
        options: >-
          --health-cmd "pg_isready -U dm -d dm_ci"
          --health-interval 2s --health-timeout 5s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["127.0.0.1:16379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: back/uv.lock
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ty check
      - name: Guard against the deprecated quadratic mask path
        run: uv run --no-sync python -m src.scripts.check_legacy_mask_path
      - name: Migrate empty database
        run: uv run --no-sync alembic upgrade head
      - name: Masking + PostgreSQL integration tests
        run: uv run --no-sync pytest -q --cov=src --cov-branch --cov-fail-under=80 --cov-report=term --cov-report=xml:coverage.xml --junitxml=test-results.xml --durations=10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-reports
          path: |
            back/coverage.xml
            back/test-results.xml
            back/coverage-data
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The FULL history: a secret committed and then deleted is still in
          # every clone, so a shallow scan misses exactly the leak that matters.
          fetch-depth: 0
      - name: Scan the history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings are reported, not silently ignored: no config override, no
          # allowlist. A false positive gets a documented .gitleaks.toml entry.
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  front:
    name: Frontend quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Exact pin, shared with ReportCollector: a floating "1.4" lets a
          # patch release change coverage output and Playwright behaviour.
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
      - run: bunx --no-install next typegen
      - run: bun run gen:labels
      - name: Verify generated label catalogue is fresh
        run: git diff --exit-code -- front/src/shared/api/labels.generated.ts
      - run: bun run typecheck
      - run: bun run lint:check
      - run: bun run format:check
      - run: bun test --coverage --coverage-reporter=lcov
      - name: Enforce frontend coverage threshold
        run: bun scripts/check-coverage.mjs 65
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: front/coverage
          retention-days: 7

  openapi-contract:
    name: OpenAPI contract freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: back/uv.lock
      - run: uv sync --locked
        working-directory: back
      - uses: oven-sh/setup-bun@v2
        with:
          # Same exact pins as the front job: generator output must be stable.
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: bun install --frozen-lockfile
        working-directory: front
      - run: bun run gen:openapi --check
        working-directory: front

  production:
    name: Production images and browser smoke
    needs: [config, back, front]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_BASE_URL: http://127.0.0.1:15001
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # Exact pin, shared with ReportCollector: a floating "1.4" lets a
          # patch release change coverage output and Playwright behaviour.
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: docker/setup-buildx-action@v4
      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: ./back
          target: prod
          load: true
          tags: dm-back:ci
          cache-from: type=gha,scope=back
          cache-to: type=gha,mode=max,scope=back
      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: ./front
          target: prod
          load: true
          tags: dm-front:ci
          cache-from: type=gha,scope=front
          cache-to: type=gha,mode=max,scope=front
      - name: Start tested production images (back, worker, front)
        run: docker compose -f infra/compose.ci.yaml up -d --no-build --wait --wait-timeout 180 back worker front
      - name: Apply Alembic migrations to the isolated CI database
        run: |
          docker compose -f infra/compose.ci.yaml exec -T back alembic upgrade head
          docker compose -f infra/compose.ci.yaml restart worker
      - name: Install browser
        working-directory: front
        run: |
          bun install --frozen-lockfile
          bunx --no-install playwright install --with-deps chromium
      - name: Verify the smoke project actually lists every regression
        working-directory: front
        run: |
          bunx --no-install playwright test --project=smoke --list > smoke-tests.txt
          cat smoke-tests.txt
          bun e2e/check-smoke-discovery.mjs smoke-tests.txt
      - name: Browser smoke
        run: bun run --cwd front test:e2e --project=smoke --reporter=list
      - name: Export tested release images
        if: startsWith(github.ref, 'refs/tags/v')
        run: docker save -o production-images.tar dm-back:ci dm-front:ci
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: production-images
          path: production-images.tar
          retention-days: 1
          compression-level: 0
      - name: Collect container logs
        if: always()
        run: docker compose -f infra/compose.ci.yaml logs --no-color > container-logs.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-and-container-reports
          path: |
            front/playwright-report
            front/test-results
            container-logs.txt
          retention-days: 7
      - name: Stop isolated stack
        if: always()
        run: docker compose -f infra/compose.ci.yaml down --volumes --remove-orphans

  required:
    name: CI required
    if: always()
    needs: [config, back, front, openapi-contract, secrets, production]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
