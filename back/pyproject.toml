[project]
name = "docmasker-back"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "natasha>=1.6.0",
    "phonenumbers>=9.0.39",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.15.0",
    # natasha -> pymorphy2 imports `pkg_resources` at runtime; on Python 3.14
    # setuptools is no longer pulled in transitively, and setuptools>=81 dropped
    # `pkg_resources`, so it must be explicit AND pinned below 81.
    "setuptools>=80.0.0,<81",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
# `natasha` -> `pymorphy2` imports the deprecated `pkg_resources` at runtime;
# with `filterwarnings = error` that deprecation would fail every test that
# builds a MorphVocab. Scoped to that one message rather than a blanket ignore.
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:UserWarning",
]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
extend-exclude = []
target-version = "py314"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Форматтер Ruff может конфликтовать с этим правилом
    "CPY001",  # Копирайт не требуется
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",  # Докстринги необязательны
    "D203", "D212",  # Конфликты с предпочтительными правилами
    "E402",  # Импорты допустимы не в начале файла
    "FBT001", "FBT002",  # Позиционные логические аргументы допустимы
    "FIX002",  # TODO допустимы
    "INP001",  # Пространства имён без __init__.py допустимы
    "C416",  # Стиль включений рекомендательный
    "C901",  # Метрики сложности рекомендательные
    "E501",  # Длина строки рекомендательная
    "PERF401", "PERF402", "PERF403",  # Микрооптимизации рекомендательные
    "PLR0911", "PLR0912", "PLR0913", "PLR0914", "PLR0915", "PLR0917",  # Метрики функций рекомендательные
    "PLR2004",  # Магические значения рекомендательные
    "RET504",  # Присваивание перед return может улучшать читаемость
    "RUF001", "RUF002", "RUF003",  # Кириллица и схожие буквы допустимы
    "TC002", "TC003",  # Импорты типов не выносятся в TYPE_CHECKING
    "N815",  # Поля Pydantic-схем повторяют camelCase-контракт
    "TD002", "TD003",  # Для TODO не нужны авторы и ссылки
    "TRY003",  # Стандартное исключение предпочтительнее лишнего класса
]

[tool.ruff.lint.per-file-ignores]
"src/masking/*" = [
    "BLE001",  # Degraded windowing fallback may catch any prepare_batch error
    "SLF001",  # python-docx lxml element access (paragraph._p) for stable identity
]
"tests/*" = [
    "ANN001",  # Параметры тестов не аннотируются
    "ANN201",  # Возвращаемые типы фикстур не аннотируются
    "ARG001",  # Фикстуры-зависимости могут не использоваться
    "ARG002",  # Тестовые стабы повторяют сигнатуру протокола, но не используют аргументы
    "B007",  # Переменные распаковки не используются
    "D213",  # Докстринги тестов сохраняют стиль
    "PERF102",  # Включения по values() не оптимизируются
    "PLC0415",  # Импорты в тестах допустимы
    "S101",  # В тестах используется assert
    "SLF001",  # Сборка фикстур .docx идёт через lxml-элементы (paragraph._p)
]

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true
quote-style = "double"
indent-style = "space"
