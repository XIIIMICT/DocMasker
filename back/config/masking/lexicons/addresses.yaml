schema_version: 1
# Lower-case abbreviations that end with a period but do NOT end an address.
abbreviations:
  - г
  - ул
  - д
  - кв
  - вн
  - тер
  - наб
  - пер
  - просп
  - пр
  - обл
  - р
  - н
  - пом
  - помещ
  - ком
  - эт
  - этаж
  - оф
  - стр
  - корп
  - ш
  - б
# Keywords that make a span look like an address (checked as substrings in code).
# Alphabetic entries of 3+ letters are also whole-word candidate markers for
# the address prefilter; shorter stems are handled as bare/dotted abbreviations.
keywords:
  - "г."
  - "г "
  - ул
  - "д."
  - "д "
  - просп
  - пер
  - шоссе
  - обл
  - р-н
  - кв
  # Full-word markers (DM-2): literal source of truth, never a Python list.
  - улица
  - дом
  - переулок
  - проспект
  - набережная
  - квартира
  - корпус
  - строение
  - помещение
