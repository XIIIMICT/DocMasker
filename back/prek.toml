#:schema https://www.schemastore.org/prek.json

orphan = true
default_stages = ["pre-commit"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format"
language = "system"
files = '\.py$'
require_serial = true

[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --fix"
language = "system"
files = '\.py$'
require_serial = true

[[repos.hooks]]
id = "ty-check"
name = "ty check"
# Shared hook policy (maintainer decision, 2026-11-25): staged files at commit,
# whole tree in CI. Do not switch this back to a whole-tree manual hook.
entry = "uv run ty check"
language = "system"
files = '\.py$'
require_serial = true

[[repos.hooks]]
id = "uv-lock"
name = "uv lock"
entry = "uv lock"
language = "system"
pass_filenames = false
files = '^pyproject\.toml$'
